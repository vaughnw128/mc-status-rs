single-container:
  name: "mc-status-rs"
  image: "ghcr.io/vaughnw128/mc-status-rs"
  imageTag: "0.2.3"
  secretVars:
    DISCORD_TOKEN: "mc-status-rs-discord-token/credential"
  envVars:
    MAPS_ADDRESS: "https://maps.vaughn.sh"
    MC_SERVER_IP: "mc.vaughn.sh"
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 128Mi
